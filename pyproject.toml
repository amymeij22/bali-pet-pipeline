[project]
name = "biometeo-worker"
version = "0.1.0"
description = "Windows-based scheduled biometeo data pipeline worker"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q --html=reports/pytest-report.html --self-contained-html"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
markers = [
    "biometeo_smoke: membutuhkan biometeo terpasang (wheel sesuai Python/OS)"
]

[tool.coverage.run]
source = ["src/biometeo_worker"]
omit = [
    "*/tests/*",
    "*/scripts/*"
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError:",
    "pass",
    "\\.\\.\\."
]
fail_under = 100

